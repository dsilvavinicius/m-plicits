# Training / reconstruction environment (verified 2026-09-16 on Windows 11,
# RTX 5090, CUDA 12.8 driver). PyTorch comes from the cu128 wheel index; on
# Linux the same pins work (the server runs a plain venv from
# requirements.txt).
name: new_i3d
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - setuptools
  - pip:
      - -r requirements.txt
