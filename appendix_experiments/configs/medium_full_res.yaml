# Cell (b): residual WITHOUT nested band (full-domain Sitzmann-style sampling),
# medium stage. Same architecture/epochs as cell (a) medium.
network:
  hidden_layers: [256, 256]
  omega_0: 45
  omega_w: 45
  in_coords: 3
  out_coords: 1
  residual: True

optimizer:
  lr: 0.0001
  type: adam

training:
  epochs: 1500
  batchsize: 900000

sampling:
  type: uniform
  curvature_fractions: [0.2, 0.6, 0.2]
  curvature_percentiles: [0.6, 0.95]
