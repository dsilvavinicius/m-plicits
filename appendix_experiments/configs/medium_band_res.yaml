# Cell (a): residual + nested band, medium stage. Mirrors the paper setup
# (results/<shape>/medium/config.yaml).
network:
  hidden_layers: [256, 256]
  omega_0: 45
  omega_w: 45
  in_coords: 3
  out_coords: 1
  residual: True

optimizer:
  lr: 0.0001
  type: adam

training:
  epochs: 1500
  delta: 0.001
  batchsize: 900000
  neighborhood_delta: True
  dithering_sampling: True
  resample_sdf_at: 10

constraint_weights:
  grad_constraint: 50.0
  normal_constraint: 100.0
  sdf_constraint: 3000.0

sampling:
  type: uniform
  curvature_fractions: [0.2, 0.6, 0.2]
  curvature_percentiles: [0.6, 0.95]
