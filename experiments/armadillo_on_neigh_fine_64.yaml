network:
  hidden_layers: [256,256]
  omega_0: 100
  omega_w: 100
  in_coords: 3
  out_coords: 1
  residual: True

optimizer:
  lr: 0.0001
  type: adam

training:
  coarse_model: "results/armadillo_coarse_64/best.pth"
  level1: "results/armadillo_medium_64/best.pth"
  epochs: 1000
  batchsize: 300000
  delta: 0.001
  neighborhood_delta: True
  dithering_sampling: True

sampling:
  type: uniform  # curvature or uniform
  curvature_fractions: [0.2, 0.6, 0.2]
  curvature_percentiles: [0.6, 0.95]
