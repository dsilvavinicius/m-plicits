network:
  hidden_layers: [128, 128, 128]
  omega_0: 70
  omega_w: 70
  in_coords: 3
  out_coords: 1

optimizer:
  lr: 0.0001
  type: adam

training:
  epochs: 10000
  resample_sdf_at: 10  # this is in epochs
  batchsize: 2000000

sampling:
  type: uniform  # curvature or uniform
  curvature_fractions: [0.2, 0.6, 0.2]
  curvature_percentiles: [0.6, 0.95]
