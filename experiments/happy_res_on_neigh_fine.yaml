network:
  hidden_layers: [256, 256]
  omega_0: 100
  omega_w: 100
  in_coords: 3
  out_coords: 1
  residual: True

optimizer:
  lr: 0.0001
  type: adam

training:
  coarse_model: "data/happy_mipplicits/happy_64x1.pth"
  level1: "data/happy_mipplicits/happy_128x1.pth"
  epochs: 3000
  batchsize: 300000
  delta: 0.001
  neighborhood_delta: True
  dithering_sampling: False

sampling:
  type: uniform  # curvature or uniform
  curvature_fractions: [0.2, 0.6, 0.2]
  curvature_percentiles: [0.6, 0.95]
